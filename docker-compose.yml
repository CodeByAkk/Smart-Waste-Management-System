version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartwaste-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped
    networks:
      - smartwaste-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartwaste-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - smartwaste-net

networks:
  smartwaste-net:
    driver: bridge
